{% extends "member/base.html" %}

{% block title %}My Profile{% endblock %}
{% block page_title %}Member Profile Management{% endblock %}
{% block breadcrumb %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="app-card">
            <div class="app-card-header">
                <h5 class="app-card-title">
                    <i class="bi bi-person-circle text-emerald-400"></i>
                    <span>Personal Profile Details</span>
                </h5>
            </div>

            <form action="{{ url_for('member_profile') }}" method="POST" class="space-y-4">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label text-xs font-semibold">Full Name <span class="text-rose-400">*</span></label>
                        <input type="text" name="full_name" value="{{ member.full_name or '' }}" class="form-control" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-xs font-semibold">Email Address (Read Only)</label>
                        <input type="email" value="{{ member.email or '' }}" class="form-control bg-slate-900 border-slate-700 text-slate-400" readonly>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-xs font-semibold">Phone Number <span class="text-rose-400">*</span></label>
                        <input type="tel" name="phone" value="{{ member.phone or '' }}" class="form-control" required>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label text-xs font-semibold">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label text-xs font-semibold">Date of Birth</label>
                        <input type="date" name="dob" value="{{ member.dob or '' }}" class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label text-xs font-semibold">Residential Address</label>
                        <input type="text" name="address" value="{{ member.address or '' }}" class="form-control" placeholder="e.g. Model Colony, Pune">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-xs font-semibold">Emergency Contact Phone</label>
                        <input type="tel" name="emergency_contact" value="{{ member.emergency_contact or '' }}" class="form-control" placeholder="+91 98765 00000">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-xs font-semibold">Primary Fitness Goal</label>
                        <input type="text" name="fitness_goal" value="{{ member.fitness_goal or '' }}" class="form-control" placeholder="e.g. Muscle gain, Weight loss">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800 d-flex justify-content-end gap-3">
                    <button type="submit" class="btn-gym-primary px-5 text-xs font-bold">
                        <i class="bi bi-check-circle-fill"></i> Save Profile Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
